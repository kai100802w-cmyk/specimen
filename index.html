<script type="module">
import React from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";

// @ts-nocheck
const { useState, useEffect, useMemo, useRef } = React;
/* lucide-react の代わりに最小SVGで定義 */
const mkIcon = (d, fill) => (p) => React.createElement("svg", {

const CalendarDays = mkIcon("M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z");

const ClipboardList = mkIcon("M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 2h6v4H9zM8 11h.01M12 11h4M8 16h.01M12 16h4");
const Cog = mkIcon("M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0-1.2-2.9H.8a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.6V.8a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z");
const Plus = mkIcon("M12 5v14M5 12h14");
const Trash2 = mkIcon("M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6");
const Check = mkIcon("M20 6 9 17l-5-5");
const ChevronLeft = mkIcon("M15 18l-6-6 6-6");
const ChevronRight = mkIcon("M9 18l6-6-6-6");
const AlertTriangle = mkIcon("M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0");
const Dumbbell = mkIcon("M7 6v12M4 9v6M17 6v12M20 9v6M7 12h10");
const Footprints = mkIcon("M8 3a2 2 0 0 1 2 2v6a2 2 0 0 1-4 0V5a2 2 0 0 1 2-2zM6 15h4v3a2 2 0 0 1-4 0zM16 6a2 2 0 0 1 2 2v6a2 2 0 0 1-4 0V8a2 2 0 0 1 2-2zM14 18h4v3a2 2 0 0 1-4 0z");
const Award = mkIcon("M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.2 13.9 7 22l5-3 5 3-1.2-8.1");
const Target = mkIcon("M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z");
const Download = mkIcon("M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3");
const Upload = mkIcon("M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12");
const RotateCcw = mkIcon("M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5");
const Info = mkIcon("M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16v-4M12 8h.01");
/* ══════════════════════════════════════════════════════════════
   配色 — 実験施設の記録端末
   ══════════════════════════════════════════════════════════════ */
const K = {
    bg: "#0b0e13", panel: "#121821", panel2: "#0e141c",
    line: "#243040", line2: "#1a2330",
    text: "#c8d3df", mute: "#7a8798", dim: "#4d5866",
    amber: "#e8a33d", cyan: "#57bdd4", red: "#cc4b41", green: "#6ba84f", violet: "#9a7fd0",
};
const MONO = 'ui-monospace, SFMono-Regular, Menlo, "SF Mono", monospace';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const todayStr = () => new Date().toLocaleDateString("sv-SE");
const addDays = (d, n) => { const t = new Date(d + "T00:00:00"); t.setDate(t.getDate() + n); return t.toLocaleDateString("sv-SE"); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
/* ══════════════════════════════════════════════════════════════
   能力値の算出
   ※ 配点はすべて主観です。設定タブに根拠を明記しています。
   ══════════════════════════════════════════════════════════════ */
const PARAMS = {
    INT: { key: "INT", jp: "知力", color: "#57bdd4", desc: "知識量・資格・学習量" },
    VIT: { key: "VIT", jp: "体力", color: "#6ba84f", desc: "筋力訓練と走行の記録" },
    TEC: { key: "TEC", jp: "技能", color: "#e8a33d", desc: "資格の難度と完遂した任務量" },
    PER: { key: "PER", jp: "継続", color: "#9a7fd0", desc: "定期行動の定着度と連続記録" },
    EXE: { key: "EXE", jp: "遂行", color: "#cc4b41", desc: "任務の完了率と期限遵守率" },
};
const PK = Object.keys(PARAMS);
const GRADES = [
    { at: 90, g: "S", c: "#e8a33d" }, { at: 76, g: "A", c: "#57bdd4" },
    { at: 62, g: "B", c: "#6ba84f" }, { at: 46, g: "C", c: "#c8d3df" },
    { at: 30, g: "D", c: "#9a7fd0" }, { at: 0, g: "E", c: "#cc4b41" },
];
const gradeOf = (v) => GRADES.find((x) => v >= x.at) || GRADES[GRADES.length - 1];
const CLASS_OF = (v) => v >= 90 ? "完成体" : v >= 76 ? "上位固体" : v >= 62 ? "安定期" :
    v >= 46 ? "成長期" : v >= 30 ? "初期形態" : "観察開始";
function evaluate(st) {
    const t = todayStr();
    const in30 = (d) => daysBetween(d, t) >= 0 && daysBetween(d, t) <= 30;
    /* INT 知力 */
    const mastered = st.recall.mastered || 0;
    const i1 = clamp(mastered * 0.5, 0, 50);
    const i2 = clamp(st.certs.reduce((a, c) => a + c.rank * 3, 0), 0, 30);
    const i3 = clamp(st.tasks.filter((x) => x.done && x.kind === "study").length * 0.8, 0, 20);
    const INT = Math.round(i1 + i2 + i3);
    /* VIT 体力 */
    const tr = st.training.filter((x) => in30(x.date));
    const v1 = clamp(tr.length * 1.8, 0, 40);
    const vol = tr.filter((x) => x.kind === "strength").reduce((a, x) => a + (x.sets || 0) * (x.reps || 0), 0);
    const v2 = clamp(vol / 20, 0, 30);
    const km = tr.filter((x) => x.kind === "run").reduce((a, x) => a + (x.km || 0), 0);
    const v3 = clamp(km * 1.0, 0, 30);
    const VIT = Math.round(v1 + v2 + v3);
    /* TEC 技能 */
    const c1 = clamp(st.certs.reduce((a, c) => a + c.rank * 5, 0), 0, 50);
    const c2 = clamp(st.tasks.filter((x) => x.done).length * 1.0, 0, 50);
    const TEC = Math.round(c1 + c2);
    /* PER 継続 */
    const hs = st.habits.map((h) => habitStat(st, h));
    const p1 = hs.length ? clamp(hs.reduce((a, x) => a + x.pct, 0) / hs.length * 0.7, 0, 70) : 0;
    const p2 = clamp(streakOf(st), 0, 30);
    const PER = Math.round(p1 + p2);
    /* EXE 遂行 */
    const due30 = st.tasks.filter((x) => x.date && in30(x.date));
    const done30 = due30.filter((x) => x.done);
    // 母数が5件未満のときは信頼度で割り引く（1件成功で満点にしない）
    const e1 = due30.length ? clamp((done30.length / due30.length) * 60 * Math.min(1, due30.length / 5), 0, 60) : 0;
    const onTime = done30.filter((x) => x.doneAt && x.doneAt <= x.date);
    const e2 = done30.length ? clamp((onTime.length / done30.length) * 40 * Math.min(1, done30.length / 5), 0, 40) : 0;
    const EXE = Math.round(e1 + e2);
    const vals = { INT, VIT, TEC, PER, EXE };
    const total = Math.round(PK.reduce((a, k) => a + vals[k], 0) / PK.length);
    /* 所見 */
    const notes = [];
    const overdue = st.tasks.filter((x) => !x.done && x.date && x.date < t);
    if (overdue.length)
        notes.push({ lv: "warn", t: `期限超過の任務 ${overdue.length}件。EXEの低下要因。まず1件を処理せよ。` });
    const low = PK.reduce((a, b) => (vals[a] <= vals[b] ? a : b));
    const rec = {
        INT: `Recall の習得数 +10 で INT +5。資格1件（難度3）で +9。`,
        VIT: `運動を週2回で30日 VIT +14。走行 10km で +10。`,
        TEC: `任務を10件完遂で TEC +10。資格1件（難度3）で +15。`,
        PER: `定期行動を1つ増やし30日継続で PER +14。連続記録が直接加算される。`,
        EXE: `期限内完了を積むと EXE は最速で伸びる。期限のない任務は評価対象外。`,
    }[low];
    notes.push({ lv: "info", t: `最低値は ${low}（${PARAMS[low].jp}）${vals[low]}。${rec}` });
    const weakH = st.habits.filter((h) => habitStat(st, h).pct < 35 && daysBetween(h.since, t) > 14);
    if (weakH.length)
        notes.push({ lv: "warn", t: `定着していない定期行動 ${weakH.length}件。実行の敷居を下げるか、きっかけを見直せ。` });
    if (!st.training.some((x) => daysBetween(x.date, t) <= 7))
        notes.push({ lv: "warn", t: "直近7日の訓練記録なし。VITは30日で減衰する。" });
    if (PK.every((k) => vals[k] >= 62))
        notes.push({ lv: "ok", t: "全パラメータが B 以上。突出項目の強化段階へ移行可能。" });
    const goalsNear = st.goals.filter((g) => !g.done && g.due && daysBetween(t, g.due) <= 30 && daysBetween(t, g.due) >= 0);
    goalsNear.forEach((g) => notes.push({ lv: "info", t: `目標「${g.title}」まで ${daysBetween(t, g.due)}日。進捗 ${g.progress}%。` }));
    return { vals, total, grade: gradeOf(total), cls: CLASS_OF(total), notes, overdue: overdue.length,
        breakdown: { INT: [i1, i2, i3], VIT: [v1, v2, v3], TEC: [c1, c2], PER: [p1, p2], EXE: [e1, e2] } };
}
function streakOf(st) {
    const t = todayStr();
    let n = 0;
    for (let i = 0; i < 400; i++) {
        const d = addDays(t, -i);
        const act = st.habits.some((h) => (h.log || []).includes(d)) ||
            st.tasks.some((x) => x.doneAt === d) || st.training.some((x) => x.date === d);
        if (act)
            n++;
        else if (i > 0)
            break; // 今日未実施はまだ途切れとみなさない
    }
    return n;
}
const HABIT_MEDIAN = 66;
function habitStat(st, h) {
    const t = todayStr();
    const elapsed = Math.max(1, daysBetween(h.since, t) + 1);
    const win = Math.min(30, elapsed);
    let hit = 0;
    for (let i = 0; i < win; i++)
        if ((h.log || []).includes(addDays(t, -i)))
            hit++;
    let run = 0;
    for (let i = 0; i < 400; i++) {
        if ((h.log || []).includes(addDays(t, -i)))
            run++;
        else if (i > 0)
            break;
    }
    const rate = hit / win;
    const pct = Math.round(clamp((Math.min(elapsed, HABIT_MEDIAN) / HABIT_MEDIAN) * 50 + rate * 50, 0, 100));
    const state = pct >= 80 ? "定着" : pct >= 50 ? "形成中" : elapsed > 14 ? "不安定" : "観察中";
    return { elapsed, hit, win, rate, pct, run, state };
}
/* ══════════════════════════════════════════════════════════════
   初期データ
   ══════════════════════════════════════════════════════════════ */
const DEF_PROJ = [
    { id: "p1", name: "業務", color: "#cc4b41" },
    { id: "p2", name: "学習", color: "#57bdd4" },
    { id: "p3", name: "身体", color: "#6ba84f" },
    { id: "p4", name: "private", color: "#9a7fd0" },
];
const blank = () => ({
    v: 1, name: "SUBJECT", code: "XX-" + String(Math.floor(Math.random() * 9000) + 1000),
    since: todayStr(),
    projects: DEF_PROJ.map((p) => ({ ...p })),
    tasks: [], habits: [], training: [], certs: [], goals: [],
    recall: { mastered: 0, total: 0, at: null },

function seeded() {
    const s = blank();
    const t = todayStr();
    s.since = addDays(t, -58);
    s.name = "SUBJECT";
    s.recall = { mastered: 96, total: 240, at: t };
    s.certs = [
        { id: uid(), name: "基本情報技術者", date: addDays(t, -300), rank: 3 },
        { id: uid(), name: "ITパスポート", date: addDays(t, -520), rank: 1 },
    ];
    s.goals = [
        { id: uid(), title: "応用情報技術者 合格", due: addDays(t, 82), progress: 35, done: false },
        { id: uid(), title: "懸垂10回", due: addDays(t, 120), progress: 40, done: false },
    ];
    s.habits = [
        { id: uid(), title: "技術書を15分読む", trigger: "帰宅して座ったら", pid: "p2", since: addDays(t, -52), log: [] },
        { id: uid(), title: "筋力訓練", trigger: "起床後すぐ", pid: "p3", since: addDays(t, -40), log: [] },
        { id: uid(), title: "学習アプリで復習", trigger: "電車に乗ったら", pid: "p2", since: addDays(t, -30), log: [] },
    ];
    let seed = 3;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
    s.habits.forEach((h, hi) => {
        const el = daysBetween(h.since, t);
        for (let i = 0; i <= el; i++)
            if (rnd() < [0.72, 0.48, 0.85][hi])
                h.log.push(addDays(h.since, i));
    });
    for (let i = 40; i >= 0; i--) {
        const d = addDays(t, -i);
        if (rnd() < 0.42)
            s.training.push({ id: uid(), date: d, kind: "strength", name: "全身", sets: 3, reps: 10 + Math.floor(rnd() * 6) });
        if (rnd() < 0.24)
            s.training.push({ id: uid(), date: d, kind: "run", name: "ジョグ", km: Math.round((2.5 + rnd() * 4) * 10) / 10, min: 20 + Math.floor(rnd() * 25) });
    }
    const titles = ["設計書レビュー", "検証環境の構築", "障害報告のまとめ", "参考書 30ページ", "手順書の更新", "定例会の資料", "ログ調査", "証跡の整理"];
    for (let i = 30; i >= -6; i--) {
        if (rnd() < 0.5) {
            const d = addDays(t, -i);
            const done = i > 0 && rnd() < 0.78;
            s.tasks.push({
                id: uid(), title: titles[Math.floor(rnd() * titles.length)],
                pid: DEF_PROJ[Math.floor(rnd() * 4)].id, date: d,
                time: rnd() < 0.72 ? ["08:30", "10:00", "13:00", "15:30", "19:00", "21:00"][Math.floor(rnd() * 6)] : "",
                dur: [30, 45, 60, 90, 120][Math.floor(rnd() * 5)],
                done, doneAt: done ? (rnd() < 0.8 ? d : addDays(d, 1)) : null,
                pri: rnd() < 0.25 ? 2 : 1,
                kind: rnd() < 0.35 ? "study" : "work",
            });
        }
    }
    // 今週にサンプルを配置（タイムラインの表示確認用）
    const ws = addDays(t, -new Date(t + "T00:00:00").getDay());
    const week = [
        [1, "09:30", 90, "p1", "定例会と進捗共有", "work"],
        [1, "14:00", 120, "p1", "検証環境の構築", "work"],
        [1, "21:00", 45, "p2", "参考書 20ページ", "study"],
        [2, "07:00", 45, "p3", "朝ラン", "work"],
        [2, "13:00", 60, "p1", "障害報告のまとめ", "work"],
        [2, "13:30", 60, "p2", "資格の過去問", "study"],
        [3, "10:00", 180, "p1", "設計書レビュー", "work"],
        [3, "20:00", 60, "p3", "筋力訓練", "work"],
